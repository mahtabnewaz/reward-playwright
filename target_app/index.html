<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample App</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f0f2f5}
        .container{background:#fff;padding:2rem;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);width:420px}
        h1{margin-bottom:1.5rem;color:#333}
        .form-group{margin-bottom:1rem}
        label{display:block;margin-bottom:.5rem;color:#555;font-weight:bold}
        input{width:100%;padding:.75rem;border:1px solid #ddd;border-radius:4px;font-size:1rem}
        input:focus{outline:none;border-color:#4a90d9}
        button{width:100%;padding:.75rem;background:#4a90d9;color:#fff;border:none;border-radius:4px;font-size:1rem;cursor:pointer;margin-top:.5rem}
        button:hover{background:#357abd}
        .error{color:#e74c3c;font-size:.875rem;margin-top:.5rem;display:none}
        .success{color:#27ae60;font-size:.875rem;margin-top:.5rem;display:none}
        .nav{display:flex;gap:1rem;margin-bottom:1.5rem}
        .nav a{color:#4a90d9;text-decoration:none;padding:.5rem 1rem;border-radius:4px;cursor:pointer}
        .nav a:hover,.nav a.active{background:#e8f0fe}
        .todo-item{display:flex;align-items:center;gap:.5rem;padding:.5rem 0;border-bottom:1px solid #eee}
        .todo-item input[type="checkbox"]{width:auto}
        #todo-list{margin-top:1rem}
        .search-results{background:#fff;border:1px solid #ddd;border-radius:4px;max-height:200px;overflow-y:auto;display:none;margin-top:.25rem}
        .search-results div{padding:.5rem .75rem;cursor:pointer}
        .search-results div:hover{background:#f0f2f5}
        .badge{display:inline-block;background:#e8f0fe;color:#4a90d9;padding:.2rem .5rem;border-radius:4px;font-size:.75rem;margin-left:.5rem}
    </style>
</head>
<body>
<div class="container">
    <nav class="nav">
        <a data-page="login" class="active" data-testid="nav-login">Login</a>
        <a data-page="todo" data-testid="nav-todo">Todo</a>
        <a data-page="search" data-testid="nav-search">Search</a>
    </nav>
    <div id="page-login" class="page">
        <h1 data-testid="login-title">Login</h1>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" data-testid="username-input" placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" data-testid="password-input" placeholder="Enter password">
        </div>
        <button data-testid="login-button" onclick="handleLogin()">Login</button>
        <div class="error" id="login-error" data-testid="login-error"></div>
        <div class="success" id="login-success" data-testid="login-success">Login successful! Welcome back.</div>
    </div>
    <div id="page-todo" class="page" style="display:none">
        <h1 data-testid="todo-title">Todo List</h1>
        <div class="form-group">
            <input type="text" id="todo-input" data-testid="todo-input" placeholder="Add a new task...">
        </div>
        <button data-testid="add-todo-button" onclick="addTodo()">Add Task</button>
        <div data-testid="todo-count" class="badge" style="margin-top:.5rem">0 tasks</div>
        <div id="todo-list" data-testid="todo-list"></div>
    </div>
    <div id="page-search" class="page" style="display:none">
        <h1 data-testid="search-title">Search</h1>
        <div class="form-group">
            <input type="text" id="search-input" data-testid="search-input" placeholder="Search..." oninput="handleSearch()">
            <div class="search-results" id="search-results" data-testid="search-results"></div>
        </div>
        <div data-testid="search-count" style="margin-top:.5rem;color:#888;font-size:.875rem"></div>
    </div>
</div>
<script>
document.querySelectorAll('.nav a').forEach(link=>{
    link.addEventListener('click',()=>{
        document.querySelectorAll('.nav a').forEach(l=>l.classList.remove('active'));
        link.classList.add('active');
        document.querySelectorAll('.page').forEach(p=>p.style.display='none');
        document.getElementById('page-'+link.dataset.page).style.display='block';
    });
});
function handleLogin(){
    const u=document.getElementById('username').value;
    const p=document.getElementById('password').value;
    const err=document.getElementById('login-error');
    const ok=document.getElementById('login-success');
    err.style.display='none';ok.style.display='none';
    if(!u||!p){err.textContent='Please fill in all fields';err.style.display='block';}
    else if(u==='admin'&&p==='password123'){ok.style.display='block';}
    else{err.textContent='Invalid username or password';err.style.display='block';}
}
let tid=0;
function addTodo(){
    const input=document.getElementById('todo-input');
    const text=input.value.trim();
    if(!text)return;
    tid++;
    const item=document.createElement('div');
    item.className='todo-item';
    item.setAttribute('data-testid','todo-item-'+tid);
    item.innerHTML='<input type="checkbox" data-testid="todo-check-'+tid+'" onchange="toggleTodo(this)"><span data-testid="todo-text-'+tid+'">'+text+'</span><button data-testid="todo-delete-'+tid+'" onclick="deleteTodo(this)" style="margin-left:auto;background:#e74c3c;padding:.25rem .5rem;font-size:.8rem;width:auto">Delete</button>';
    document.getElementById('todo-list').appendChild(item);
    input.value='';
    updateCount();
}
function deleteTodo(btn){btn.parentElement.remove();updateCount();}
function toggleTodo(cb){cb.nextElementSibling.style.textDecoration=cb.checked?'line-through':'none';}
function updateCount(){
    const n=document.querySelectorAll('.todo-item').length;
    document.querySelector('[data-testid="todo-count"]').textContent=n+' task'+(n!==1?'s':'');
}
const data=['Apple','Banana','Cherry','Date','Elderberry','Fig','Grape','Honeydew','Kiwi','Lemon','Mango','Nectarine','Orange','Papaya','Quince'];
function handleSearch(){
    const q=document.getElementById('search-input').value.toLowerCase();
    const r=document.getElementById('search-results');
    const c=document.querySelector('[data-testid="search-count"]');
    if(!q){r.style.display='none';c.textContent='';return;}
    const f=data.filter(i=>i.toLowerCase().includes(q));
    r.innerHTML=f.map(i=>'<div data-testid="search-result-item" onclick="selectResult(\''+i+'\')">'+i+'</div>').join('');
    r.style.display=f.length?'block':'none';
    c.textContent=f.length+' result'+(f.length!==1?'s':'')+' found';
}
function selectResult(v){
    document.getElementById('search-input').value=v;
    document.getElementById('search-results').style.display='none';
}
</script>
</body>
</html>
